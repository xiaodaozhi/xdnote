name: Update core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-core:
    name: Rust update core (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/update-core/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare locked Rust dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.99.0 cargo fetch --locked
      - name: Check update core and shared Rust workspace
        run: |
          rustup run 1.99.0 cargo fmt --all -- --check
          rustup run 1.99.0 cargo clippy --locked --offline --workspace --all-targets -- -D warnings
          rustup run 1.99.0 cargo test --locked --offline --workspace --all-targets
      - name: Check recorded dependency materials
        run: python scripts/check_third_party_licenses.py
