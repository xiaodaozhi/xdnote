name: Qt document experiment

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Run the complete experiment or only the Linux AT-SPI check
        default: all
        options: [all, linux-atspi]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  experiment:
    name: Offscreen experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'linux-atspi' && '["ubuntu-22.04","ubuntu-24.04"]' || '["ubuntu-22.04","ubuntu-24.04","windows-2022","macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read shared Qt version
        id: qt-version
        shell: python
        run: |
          import json, os
          from pathlib import Path
          version = json.loads(Path('tools/desktop-dependencies.json').read_text(encoding='utf-8'))['qt']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
      # Use the pinned internal action directly; the composite wrapper references a moving v4 branch.
      - uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ steps.qt-version.outputs.version }}
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          cache: false
      - name: Configure experiment
        run: cmake -S experiments/qt-document-spike -B build/qt-document-spike -DCMAKE_BUILD_TYPE=Release
      - name: Build experiment
        run: cmake --build build/qt-document-spike --config Release --parallel 2
      - name: Clear previous Qt document test report
        shell: python
        run: |
          from pathlib import Path

          Path('build/qt-document-spike/qt_document_spike_ctest.txt').unlink(missing_ok=True)
      - name: Run offscreen experiment tests
        id: qt_tests
        run: ctest --test-dir build/qt-document-spike -C Release --output-on-failure --no-tests=error
      - name: Prepare the Linux accessibility bridge
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends at-spi2-core python3-pyatspi dbus-x11 xauth xvfb openbox gnome-shell gnome-settings-daemon xwayland
      - name: Run the guarded Quick editor through a separate AT-SPI client
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
          QT_LINUX_ACCESSIBILITY_ALWAYS_ON: '1'
          XDNOTE_ATSPI_CLIENT: ${{ github.workspace }}/experiments/qt-document-spike/tests/atspi_client.py
        run: dbus-run-session -- xvfb-run -a build/qt-document-spike/qt_document_spike_tests guardedAtspiAccessibility
      - name: Run the same AT-SPI client through native GNOME Wayland
        if: runner.os == 'Linux'
        run: bash experiments/qt-document-spike/tests/atspi-wayland.sh
      - name: Preserve native Wayland accessibility evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-document-wayland-atspi-${{ matrix.os }}
          path: |
            build/qt-document-spike/wayland-atspi/*.log
            build/qt-document-spike/wayland-atspi/qtest.txt
            build/qt-document-spike/wayland-atspi/environment.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Run the guarded Quick editor through the Cocoa accessibility bridge
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
          QT_QUICK_BACKEND: software
        run: build/qt-document-spike/qt_document_spike_tests guardedCocoaAccessibility
      - name: Report first Qt document test run
        if: ${{ always() && steps.qt_tests.outcome != 'skipped' && steps.qt_tests.outcome != '' }}
        shell: python
        run: |
          from pathlib import Path

          report = Path('build/qt-document-spike/qt_document_spike_ctest.txt')
          if not report.is_file():
              raise SystemExit('The Qt document test report was not created.')
          print(report.read_text(encoding='utf-8', errors='replace'))
      - name: Report Windows junction fixture result
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $xdnoteReport = Join-Path $env:RUNNER_TEMP ("xdnote-junction-$([guid]::NewGuid().ToString('N')).txt")
          $xdnoteTest = Join-Path $env:GITHUB_WORKSPACE 'build/qt-document-spike/Release/qt_document_spike_tests.exe'
          & $xdnoteTest windowsImageJunctionBypassesFinalNofollow -o "${xdnoteReport},txt"
          $xdnoteStatus = $LASTEXITCODE
          if (!(Test-Path -LiteralPath $xdnoteReport)) { throw 'The junction test did not create a report.' }
          Get-Content -LiteralPath $xdnoteReport
          if ($xdnoteStatus -ne 0) { throw "The junction test failed with exit code $xdnoteStatus." }
