name: Release update signing

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful main run at this revision containing the verified release-verified artifact
        type: string
        default: ''
      private_repository:
        description: Read-only private candidate transfer repository
        type: string
        default: ''
      private_commit:
        description: Exact commit of the private transfer repository
        type: string
        default: ''
      candidate_revision:
        description: Frozen source commit on main for the private candidate
        type: string
        default: ''
      verification_sha256:
        description: SHA-256 of the private candidate verification.json
        type: string
        default: ''
      recipient:
        description: Public age recipient for the signed private attachments
        type: string
        default: ''
  workflow_call:
    inputs:
      candidate_run:
        description: Prior verified run, or empty to use the calling run
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release-signing-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/build/cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/build/release-tool

jobs:
  candidate:
    if: github.repository == 'xiaodaozhi/xdnote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.resolve.outputs.artifact }}
      run: ${{ steps.resolve.outputs.run }}
      revision: ${{ steps.resolve.outputs.revision }}
      private_repository: ${{ steps.resolve.outputs.private_repository }}
      private_commit: ${{ steps.resolve.outputs.private_commit }}
    steps:
      - if: inputs.private_repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the same-revision verified artifact
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          PRIVATE_REPOSITORY: ${{ inputs.private_repository }}
          PRIVATE_COMMIT: ${{ inputs.private_commit }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          run_id=${CANDIDATE_RUN:-$GITHUB_RUN_ID}
          [[ "$run_id" =~ ^[1-9][0-9]{0,18}$ ]]
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/release-signing" |
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null; then
            echo 'Configure required reviewers on the release-signing environment before signing.' >&2
            exit 1
          fi
          if [[ -n "$PRIVATE_REPOSITORY$PRIVATE_COMMIT$CANDIDATE_REVISION$VERIFICATION_SHA256$RECIPIENT" ]]; then
            [[ -z "$CANDIDATE_RUN" ]]
            [[ "$PRIVATE_REPOSITORY" =~ ^[A-Za-z0-9-]+/xdnote-candidate-transfer-[0-9a-f]{12}$ ]]
            [[ "$PRIVATE_COMMIT" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
            [[ "$VERIFICATION_SHA256" =~ ^[0-9a-f]{64}$ && "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]
            git merge-base --is-ancestor "$CANDIDATE_REVISION" "$GITHUB_SHA"
            printf 'revision=%s\nprivate_repository=%s\nprivate_commit=%s\n' \
              "$CANDIDATE_REVISION" "$PRIVATE_REPOSITORY" "$PRIVATE_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" \
              '(.conclusion == "success" or ((.id | tostring) == $current and .status == "in_progress")) and .event == "workflow_dispatch" and .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo' >/dev/null
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=release-verified" |
            jq -er '[.artifacts[] | select(.name == "release-verified" and .expired == false) | .id] | if length == 1 then .[0] else error("expected one live verified artifact") end')
          [[ "$artifact" =~ ^[1-9][0-9]{0,18}$ ]]
          printf 'run=%s\nartifact=%s\nrevision=%s\n' "$run_id" "$artifact" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  sign:
    needs: candidate
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 30
    env:
      CANDIDATE_REVISION: ${{ needs.candidate.outputs.revision }}
      VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate.outputs.private_repository == ''
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.run }}
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          digest-mismatch: error
          path: build/release-verified
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.candidate.outputs.private_repository != ''
        with:
          repository: ${{ needs.candidate.outputs.private_repository }}
          ref: ${{ needs.candidate.outputs.private_commit }}
          path: build/release-verified
          ssh-key: ${{ secrets.XDNOTE_PRIVATE_CANDIDATE_SSH_KEY }}
          persist-credentials: false
      - name: Check the private payload binding
        if: needs.candidate.outputs.private_repository != ''
        run: |
          printf '%s  build/release-verified/verification.json\n' "$VERIFICATION_SHA256" | sha256sum --check --strict
          command -v age >/dev/null || sudo apt-get install -y --no-install-recommends age
      - name: Build the pinned signing tool
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup run 1.99.0 cargo fetch --locked
          rustup run 1.99.0 cargo build --locked --offline --release -p xdnote-update --features release-tool --bin xdnote-update-tool
      - name: Sign the verified candidate
        env:
          XDNOTE_UPDATE_KEY_ID: ${{ vars.XDNOTE_UPDATE_KEY_ID }}
          XDNOTE_UPDATE_SIGNING_KEY_HEX: ${{ secrets.XDNOTE_UPDATE_SIGNING_KEY_HEX }}
          XDNOTE_SPARKLE_SIGNING_KEY_HEX: ${{ secrets.XDNOTE_SPARKLE_SIGNING_KEY_HEX }}
        run: |
          python3 scripts/release_updates.py sign --revision "$CANDIDATE_REVISION" \
            --identity build/release-verified/identity.json --verification build/release-verified/verification.json \
            --assets build/release-verified/assets --tool build/release-tool/release/xdnote-update-tool \
            --output build/signed-metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.candidate.outputs.private_repository == ''
        with:
          name: release-signed-metadata
          path: build/signed-metadata/
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt private attachments
        if: needs.candidate.outputs.private_repository != ''
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          tar -C build/signed-metadata -cf - . | age -r "$RECIPIENT" -o build/signed-metadata.tar.age
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.candidate.outputs.private_repository != ''
        with:
          name: private-release-signed-metadata
          path: build/signed-metadata.tar.age
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [candidate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REVISION: ${{ needs.candidate.outputs.revision }}
      VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate.outputs.private_repository == ''
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.run }}
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          digest-mismatch: error
          path: build/release-verified
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate.outputs.private_repository == ''
        with:
          name: release-signed-metadata
          digest-mismatch: error
          path: build/signed-metadata
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.candidate.outputs.private_repository != ''
        with:
          repository: ${{ needs.candidate.outputs.private_repository }}
          ref: ${{ needs.candidate.outputs.private_commit }}
          path: build/release-verified
          ssh-key: ${{ secrets.XDNOTE_PRIVATE_CANDIDATE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate.outputs.private_repository != ''
        with:
          name: private-release-signed-metadata
          digest-mismatch: error
          path: build/
      - name: Check the private payload and unwrap signed attachments
        if: needs.candidate.outputs.private_repository != ''
        env:
          TRANSFER_IDENTITY: ${{ secrets.XDNOTE_PRIVATE_CANDIDATE_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          printf '%s  build/release-verified/verification.json\n' "$VERIFICATION_SHA256" | sha256sum --check --strict
          command -v age >/dev/null || sudo apt-get install -y --no-install-recommends age
          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$TRANSFER_IDENTITY" > "$key"
          mkdir -p build/signed-metadata
          age -d -i "$key" build/signed-metadata.tar.age |
            tar -xf - -C build/signed-metadata --no-same-owner --no-same-permissions
      - name: Rebuild the public verifier
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup run 1.99.0 cargo fetch --locked
          rustup run 1.99.0 cargo build --locked --offline --release -p xdnote-update --features release-tool --bin xdnote-update-tool
      - name: Independently verify the signed attachments
        run: |
          python3 scripts/release_updates.py verify --revision "$CANDIDATE_REVISION" \
            --identity build/release-verified/identity.json --verification build/release-verified/verification.json \
            --assets build/release-verified/assets --tool build/release-tool/release/xdnote-update-tool \
            --output build/signed-metadata
