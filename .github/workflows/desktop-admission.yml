name: xdnote rc.3 public native update acceptance

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native release target to exercise
        type: choice
        options: [all, windows, linux, macos]
        default: all

permissions:
  contents: read

jobs:
  public-update:
    if: github.repository == 'xiaodaozhi/xdnote' && github.ref == 'refs/heads/coding/155-rc3-public-update'
    name: Public update / ${{ matrix.platform }}
    runs-on: ${{ fromJSON('{"windows":"windows-2022","linux":"ubuntu-22.04","macos":"macos-15"}')[matrix.platform] }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows","linux","macos"]' || format('["{0}"]', inputs.platform)) }}
    env:
      PYTHONUTF8: '1'
      XDNOTE_TEST_FONT_FILE: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
      XDNOTE_QT_PREFIX: build/Qt/6.8.2/${{ fromJSON('{"windows":"msvc2022_64","linux":"gcc_64","macos":"macos"}')[matrix.platform] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 10fcb69062df2fea383e31fb83c08907929b51cb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: build/public-driver-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the public listing, release tag, and HTTPS assets
        run: python build/public-driver-source/.github/rc3-public-update/acquire.py --output build/public-delivery
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
      - name: Prepare Ubuntu 22.04 native libraries
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          mkdir -p build/ci-apt
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/ci-apt/ubuntu.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
          for mirror in https://mirrors.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe restricted multiverse\n' \
              "$mirror" jammy "$mirror" jammy-updates "$mirror" jammy-security > build/ci-apt/ubuntu.list
            if sudo timeout --kill-after=10s 90s apt-get "${apt_options[@]}" update &&
               sudo timeout --kill-after=10s 235s apt-get "${apt_options[@]}" install -y --no-remove --no-install-recommends \
                 libgl1-mesa-dev libegl1-mesa-dev libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 libxcb-xfixes0 libxkbcommon-x11-0 patchelf desktop-file-utils shared-mime-info zlib1g-dev libssl-dev libkrb5-dev libproxy-dev libpsl-dev libicu-dev libzstd-dev; then
              exit 0
            fi
          done
          exit 1
      - name: Prepare the pinned native build inputs
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) host=windows; arch=win64_msvc2022_64 ;;
            Linux) host=linux; arch=linux_gcc_64 ;;
            macOS) host=mac; arch=clang_64 ;;
          esac
          python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
          python scripts/prepare_qt.py --download --host "$host" --arch "$arch"
          python scripts/desktop.py prepare --download
          python scripts/prepare_ci_font.py --output build/test-fonts
      - name: Prepare the locked native macOS updater
        if: runner.os == 'macOS'
        run: |
          python scripts/sparkle.py prepare --download
          python scripts/sparkle.py build
      - name: Read and authenticate the public update on Windows, then install and restart
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC toolchain not found' }
          ./scripts/prepare-windows-installer.ps1 -OutputDirectory "$PWD/build/toolchain/installer"
          python scripts/prepare-windows-runtime.py --output build/toolchain/windows-runtime
          $env:PYTHONPATH = "$PWD/scripts"
          python build/public-driver-source/.github/rc3-public-update/product.py --vcvars "$vs\VC\Auxiliary\Build\vcvars64.bat" --toolchain build/toolchain/installer --runtime build/toolchain/windows-runtime --work-dir build/public-native-acceptance --qt-prefix $env:XDNOTE_QT_PREFIX --sealed-candidate build/public-delivery/release-verified --signed-attachments build/public-delivery/signed-metadata
      - name: Read and authenticate the public update on Ubuntu, then install and restart
        if: runner.os == 'Linux'
        run: |
          export PYTHONPATH="$PWD/scripts"
          python build/public-driver-source/.github/rc3-public-update/product.py --work-dir build/public-native-acceptance --qt-prefix "$XDNOTE_QT_PREFIX" --sealed-candidate build/public-delivery/release-verified --signed-attachments build/public-delivery/signed-metadata
      - name: Verify the public attachments and run the native Sparkle update
        if: runner.os == 'macOS'
        run: |
          python scripts/release_updates.py verify --revision 10fcb69062df2fea383e31fb83c08907929b51cb --identity build/public-delivery/release-verified/identity.json --verification build/public-delivery/release-verified/verification.json --assets build/public-delivery/release-verified/assets --output build/public-delivery/signed-metadata
          export PYTHONPATH="$PWD/scripts"
          python build/public-driver-source/.github/rc3-public-update/macos.py --work-dir build/public-native-acceptance --qt-prefix "$XDNOTE_QT_PREFIX" --sealed-candidate build/public-delivery/release-verified --signed-attachments build/public-delivery/signed-metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: xdnote-public-update-${{ matrix.platform }}
          path: |
            build/public-delivery/public-delivery.json
            build/public-native-acceptance/*.json
            build/public-native-acceptance/*.log
          if-no-files-found: warn
          retention-days: 7
