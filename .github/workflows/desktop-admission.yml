name: Nautilus Wayland UI preflight
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [deployment-linux]
        default: deployment-linux
permissions:
  contents: read
jobs:
  nautilus-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare a disposable GNOME desktop and stock editor
        run: |
          mkdir -p build/preflight
          cat > build/preflight/ubuntu.list <<'APT'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-security main universe
          APT
          args=(-o "Dir::Etc::sourcelist=$PWD/build/preflight/ubuntu.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          sudo apt-get "${args[@]}" update
          sudo env NEEDRESTART_MODE=l apt-get "${args[@]}" install -y --no-install-recommends nautilus mousepad gnome-shell gnome-settings-daemon xwayland libgl1-mesa-dri libegl1-mesa libglib2.0-bin openbox xdotool xvfb xauth python3-pyatspi at-spi2-core libatk-adaptor
      - name: Exercise native Nautilus controls with Mousepad
        run: bash scripts/nautilus_wayland_preflight.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stock-nautilus-wayland-evidence
          path: |
            build/preflight/evidence/*.json
            build/preflight/evidence/*.log
          retention-days: 7
