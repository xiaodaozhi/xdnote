name: macOS Launch Services default preflight
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [deployment-macos]
        default: deployment-macos
      macos_runner:
        type: choice
        options: [macos-15, macos-26]
        default: macos-26
permissions:
  contents: read
jobs:
  markdown-default:
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe Launch Services with a disposable native Markdown app
        run: bash scripts/macos_markdown_preflight.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-launchservices-preflight
          path: build/preflight/*/result.json
          retention-days: 7
