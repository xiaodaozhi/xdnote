name: Private Linux candidate packaging
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [deployment-linux]
        default: deployment-linux
permissions:
  contents: read
jobs:
  linux-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ed6ac069a0c289f8c852bbc4641f8adb32169e3a
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
      - run: python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
      - name: Prepare Linux desktop libraries
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p build/ci-apt
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/ci-apt/ubuntu.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
          for mirror in https://mirrors.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe restricted multiverse\n' \
              "$mirror" jammy "$mirror" jammy-updates "$mirror" jammy-security > build/ci-apt/ubuntu.list
            echo "Ubuntu source: $mirror"
            if sudo timeout --kill-after=10s 90s apt-get "${apt_options[@]}" update &&
               sudo timeout --kill-after=10s 235s apt-get "${apt_options[@]}" install -y --no-remove --no-install-recommends \
                 libgl1-mesa-dev libegl1-mesa-dev libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 libxcb-xfixes0 libxkbcommon-x11-0 xvfb x11-utils libglib2.0-bin patchelf zlib1g-dev libssl-dev libkrb5-dev libproxy-dev libpsl-dev libicu-dev libzstd-dev; then
              exit 0
            fi
          done
          exit 1
      - name: Prepare pinned Qt and platform sources
        run: |
          python scripts/prepare_qt.py --download --host linux --arch linux_gcc_64
          python scripts/desktop.py prepare --download
          python scripts/prepare_ci_font.py --output build/test-fonts
      - name: Build two actual versions with exact explicit identities
        shell: bash
        run: |
          set -euo pipefail
          export XDNOTE_TEST_FONT_FILE="$PWD/build/test-fonts/NotoSansCJKsc-Regular.otf"
          mkdir -p build/linux-candidate/receipts
          qt=build/Qt/6.8.2/gcc_64
          for spec in '0.1.0-beta.1 1' '0.1.0-rc.1 2'; do
            read -r version serial <<< "$spec"
            release=build/linux-candidate/$version
            mkdir "$release"
            jq -n --arg version "$version" --argjson build "$serial" --arg revision "$(git rev-parse HEAD)" \
              '{schemaVersion:1,product:"xdnote",version:$version,build:$build,revision:$revision,previousVersion:"0.0.0",previousBuild:0}' > "$release/identity-input.json"
            python scripts/desktop.py build --build-dir build/linux-candidate/desktop --qt-prefix "$qt" --parallel 4 --release-identity "$release/identity-input.json"
            python scripts/check_product_linkage.py --executable build/linux-candidate/desktop/xdnote
            python scripts/product_deployment_unix.py --build-dir build/linux-candidate/desktop --qt-prefix "$qt" --destination "$release/staging"
            python scripts/compatibility_audit.py --root "$release/staging" --report "$release/staging-evidence/compatibility.json"
            python scripts/build_linux_installer.py --root "$release/staging" --audit "$release/staging-evidence/inventory.json" \
              --output "$release/xdnote-$version-ubuntu22.04-x86_64.deb" --report "$release/debian-package.json"
            cp "$release/debian-package.json" "build/linux-candidate/receipts/$version-debian.json"
            cp "$release/staging-evidence/compatibility.json" "build/linux-candidate/receipts/$version-compatibility.json"
          done
      - name: Verify the exact Linux archive and native package pair
        run: |
          release=build/linux-candidate/0.1.0-rc.1
          python scripts/developer_archive.py --root "$release/staging" --audit "$release/staging-evidence/inventory.json" \
            --compatibility "$release/staging-evidence/compatibility.json" --output "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.xz"
          xz --decompress --stdout "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.xz" |
            gzip -n -6 > "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.gz"
          cmp <(xz -dc "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.xz") <(gzip -dc "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.gz")
          cp "$release/xdnote-0.1.0-rc.1-linux-x86_64.tar.xz.manifest.json" build/linux-candidate/receipts/canonical-tar-verification.json
          (cd "$release" && sha256sum -- *.tar.gz *.deb && wc -c -- *.tar.gz *.deb) > build/linux-candidate/receipts/candidate-assets.txt
      - name: Install the beta and upgrade to the actual RC with apt
        if: runner.environment == 'github-hosted'
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          evidence="$PWD/build/linux-candidate/receipts"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdnote-candidate-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdnote-candidate-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdnote-candidate-cache"
          mkdir "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          fixture="$XDG_DATA_HOME/upgrade fixture.md"
          printf '# User-owned candidate upgrade fixture\n' > "$fixture"
          before=$(sha256sum "$fixture")
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID $VERSION_ID" = 'ubuntu 22.04'
          ! dpkg-query -W xdnote >/dev/null 2>&1
          test ! -e /opt/xdnote
          test ! -e /run/xdnote
          trap 'if dpkg-query -W xdnote >/dev/null 2>&1; then sudo -n dpkg --purge xdnote; fi' EXIT
          apt=(sudo -n apt-get -o "Dir::Etc::sourcelist=$PWD/build/ci-apt/ubuntu.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=20 -y --no-remove)
          for spec in '0.1.0-beta.1 1' '0.1.0-rc.1 2'; do
            read -r version serial <<< "$spec"
            release="$PWD/build/linux-candidate/$version"
            package="$release/xdnote-$version-ubuntu22.04-x86_64.deb"
            printf '%s  %s\n' "$(jq -r .sha256 "$release/debian-package.json")" "$package" | sha256sum -c -
            "${apt[@]}" --no-install-recommends install "$package" | tee -a "$evidence/apt.log"
            installed=$(dpkg-query -W -f='${Version} ${Architecture}' xdnote)
            test "$installed" = "$(dpkg-deb -f "$package" Version) amd64"
            test -z "$(dpkg --verify xdnote)"
            /usr/bin/xdnote --version-json | tee "$evidence/$version-installed.json" |
              jq -e --arg version "$version" --argjson build "$serial" --arg revision "$(git rev-parse HEAD)" \
                '.product == "xdnote" and .version == $version and .build == $build and .revision == $revision and .dirty == false'
            QT_QPA_PLATFORM=xcb xvfb-run -a /usr/bin/xdnote --help >> "$evidence/native-launch.log"
            test "$before" = "$(sha256sum "$fixture")"
          done
          export XDNOTE_CANDIDATE_REPORT="$evidence"
          PYTHONPATH="$PWD/scripts" python - <<'PYPROBE'
          import json
          import os
          from pathlib import Path
          from check_linux_package_install import desktop_entry_launch

          output = Path(os.environ['XDNOTE_CANDIDATE_REPORT'])
          identity = json.loads((output / '0.1.0-rc.1-debian.json').read_bytes())
          binary = Path('/opt/xdnote/versions') / identity['runtimeId'] / 'bin/xdnote'
          files = tuple(Path(os.environ['XDG_DATA_HOME']) / f'候选交接 {index}.md' for index in range(3))
          for document in files:
              document.write_text('# Candidate desktop handoff\n', encoding='utf-8')
          report = desktop_entry_launch(Path('/usr/share/applications/xdnote.desktop'), binary, files,
                                        os.environ.copy(), output / 'candidate-native-open.log')
          (output / 'candidate-native-open.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PYPROBE
          sudo -n dpkg --purge xdnote
          ! dpkg-query -W xdnote >/dev/null 2>&1
          test "$before" = "$(sha256sum "$fixture")"
          jq -n --arg os "$PRETTY_NAME" --arg glibc "$(getconf GNU_LIBC_VERSION)" \
            '{ok:true,os:$os,glibc:$glibc,aptInstalledBeta:true,aptUpgradedToRc:true,dpkgVerified:true,nativeX11Initialized:true,userFixturePreserved:true,purged:true,productionSigned:false,published:false}' > "$evidence/upgrade.json"
      - name: Preserve only verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-candidate-packaging-evidence
          path: build/linux-candidate/receipts/
          if-no-files-found: warn
          retention-days: 7
