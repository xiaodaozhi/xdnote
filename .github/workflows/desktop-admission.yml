name: Desktop admission
run-name: ${{ inputs.scope == 'preview-unix' && 'Native preview - Unix only' || inputs.scope == 'resources-linux' && 'Workspace resources - Linux only' || inputs.scope == 'resources-macos' && 'Workspace resources - macOS only' || inputs.scope == 'resources-unix' && 'Workspace resources - Unix only' || inputs.scope == 'workspace-linux' && 'Workspace references - Linux only' || 'Desktop admission - full matrix' }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Validation scope (workspace-linux runs only affected reference/navigation tests)'
        type: choice
        default: full
        options: [full, workspace-linux, resources-unix, resources-macos, resources-linux, preview-unix]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: ${{ inputs.scope == 'preview-unix' && 'Native preview' || startsWith(inputs.scope, 'resources-') && 'Workspace resources' || inputs.scope == 'workspace-linux' && 'Workspace references' || 'Desktop' }} (${{ matrix.label || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((inputs.scope == 'workspace-linux' || inputs.scope == 'resources-linux') &&
          '[{"os":"ubuntu-22.04","host":"linux","qt-arch":"linux_gcc_64"}]' ||
          inputs.scope == 'resources-macos' &&
          '[{"os":"macos-15-intel","host":"mac","qt-arch":"clang_64"},{"os":"macos-15","host":"mac","qt-arch":"clang_64"}]' ||
          (inputs.scope == 'resources-unix' || inputs.scope == 'preview-unix') &&
          '[{"os":"ubuntu-22.04","host":"linux","qt-arch":"linux_gcc_64"},{"os":"macos-15-intel","host":"mac","qt-arch":"clang_64"},{"os":"macos-15","host":"mac","qt-arch":"clang_64"}]' ||
          '[{"os":"windows-2022","host":"windows","qt-arch":"win64_msvc2022_64"},{"os":"ubuntu-22.04","host":"linux","qt-arch":"linux_gcc_64"},{"os":"macos-15-intel","host":"mac","qt-arch":"clang_64"},{"os":"macos-15","host":"mac","qt-arch":"clang_64"},{"os":"windows-2022","host":"windows","qt-arch":"win64_msvc2022_64","profile":"msvc2019","label":"windows-2022-msvc2019"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Prepare SDK tools explicitly
        run: python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
      - name: Prepare Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 libxcb-xfixes0 libxkbcommon-x11-0 fonts-noto-cjk fonts-noto-color-emoji xvfb gdb
      - name: Prepare pinned Qt SDK with checksums
        run: python scripts/prepare_qt.py --download --host ${{ matrix.host }} --arch ${{ matrix.qt-arch }} --profile ${{ matrix.profile || 'default' }}
      - name: Prepare pinned source dependencies
        run: python scripts/desktop.py prepare --download --profile ${{ matrix.profile || 'default' }}
      - name: Check build entry point guards
        run: python -m unittest discover -s scripts/tests -v
      - name: Build desktop admission (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $xdnoteVs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$xdnoteVs) { throw 'MSVC toolchain not found' }
          python scripts/desktop.py build --vcvars "$xdnoteVs\VC\Auxiliary\Build\vcvars64.bat" --profile ${{ matrix.profile || 'default' }}
      - name: Build desktop admission (Unix)
        if: runner.os != 'Windows'
        run: python scripts/desktop.py build
      - name: Test admission on Linux virtual display
        if: runner.os == 'Linux' && inputs.scope == 'full'
        run: xvfb-run -a python scripts/desktop.py test
      - name: Test desktop admission
        if: runner.os != 'Linux' && inputs.scope == 'full'
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: ${{ runner.os == 'Windows' && '1' || '' }}
          QSG_INFO: '1'
        run: python scripts/desktop.py test --profile ${{ matrix.profile || 'default' }}
      - name: Test native preview integration on Unix
        if: inputs.scope == 'preview-unix'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python scripts/desktop.py test --suite preview
      - name: Test resource changes on Unix
        if: startsWith(inputs.scope, 'resources-')
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python scripts/desktop.py test --suite resources
          else
            python scripts/desktop.py test --suite resources
          fi
      - name: Test workspace references on Linux
        if: inputs.scope == 'workspace-linux'
        run: |
          xdnote_qt_version=$(python -c "import json; print(json.load(open('tools/desktop-dependencies.json'))['qt']['version'])")
          export LD_LIBRARY_PATH="$PWD/build/Qt/$xdnote_qt_version/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$PWD/build/Qt/$xdnote_qt_version/gcc_64/plugins"
          export QML_IMPORT_PATH="$PWD/build/Qt/$xdnote_qt_version/gcc_64/qml"
          export CARGO_HOME="$PWD/build/cargo-home"
          export CARGO_TARGET_DIR="$PWD/build/desktop-admission/cargo"
          export RUSTUP_AUTO_INSTALL=0
          rustup run 1.99.0 cargo fmt --all -- --check
          rustup run 1.99.0 cargo clippy --locked --offline --workspace --all-targets -- -D warnings
          rustup run 1.99.0 cargo test --locked --offline --workspace
          xvfb-run -a build/desktop-admission/xdnote_file_tests -o -,txt -o build/desktop-admission/file-qtest.txt,txt
          xvfb-run -a build/desktop-admission/xdnote_workspace_tests workspaceReferencesTrackSessionsFilesAndMenuCoverage workspaceReferencesCancelAndDiscardPreviousRoot workspaceReferencesDoNotUseDiskAliasesOfOutsideSessions documentLinksReuseDirtyTargetAndNavigateHeadings documentLinksRejectUnsafeTargetsAndStaleSource documentLinksPreviewClicksKeepStandaloneRouting -o -,txt -o build/desktop-admission/workspace-qtest.txt,txt
          xvfb-run -a build/desktop-admission/xdnote_desktop_tests previewPendingHeadingRejectsContextAndRevisionChanges referenceIndexUsesLiveSnapshotsAndRetainsSourceVersions referenceIndexNeverFallsBackWhenCoverageOrSessionIsUncertain workspaceDirectoryEnumerationIsBoundedAndRootBound workspaceReferenceScanUsesDiskAndAuthoritativeLiveSnapshots workspaceReferenceScanRetainsGapsAndDiscardsRevokedResults workspaceResourcesRequireTheSelectedRootAndRejectLinks previewFragmentLinksNavigateOnlyTheDisplayedRevision previewFragmentLinksSupportKeyboardFocusAndActivation previewDoesNotActivateLinksWhenReferenceAnalysisMayBeIncomplete workspaceImagesUseAuthorizedSnapshotsAndStaticDecoding -o -,txt -o build/desktop-admission/desktop-qtest.txt,txt
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('file-qtest.txt', 'workspace-qtest.txt', 'desktop-qtest.txt'):
              report = Path('build/desktop-admission', name).read_text(encoding='utf-8', errors='replace')
              if re.search(r'\b(?:QCRITICAL|QFATAL)\b|ASSERT failure|ASSERT:', report):
                  raise RuntimeError(f'Fatal Qt diagnostic in {name}')
          PY
      - name: Diagnose workspace crash on Linux
        if: failure() && runner.os == 'Linux' && inputs.scope == 'workspace-linux'
        run: |
          if [ -f build/desktop-admission/xdnote_workspace_tests ]; then
            xdnote_qt_version=$(python -c "import json; print(json.load(open('tools/desktop-dependencies.json'))['qt']['version'])")
            xdnote_qt_root="$PWD/build/Qt/$xdnote_qt_version/gcc_64"
            LD_LIBRARY_PATH="$xdnote_qt_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" QT_PLUGIN_PATH="$xdnote_qt_root/plugins" timeout 60s xvfb-run -a gdb -batch -ex 'set pagination off' -ex 'set print thread-events off' -ex run -ex 'bt 40' --args "$PWD/build/desktop-admission/xdnote_workspace_tests" -o -,txt > build/desktop-admission/workspace-crash.log 2>&1
            cat build/desktop-admission/workspace-crash.log
          fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-admission-${{ matrix.label || matrix.os }}
          path: |
            build/desktop-*/*.log
            build/desktop-*/*-qtest.txt
            build/desktop-*/Testing/Temporary/LastTest.log
            build/desktop-*/build-identity.json
            build/desktop-*/native-toolchain.json
            build/desktop-*/evidence/
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    name: ${{ inputs.scope == 'preview-unix' && 'Native preview (Unix)' || inputs.scope == 'resources-linux' && 'Workspace resources (Linux)' || inputs.scope == 'resources-macos' && 'Workspace resources (macOS)' || inputs.scope == 'resources-unix' && 'Workspace resources (Unix)' || inputs.scope == 'workspace-linux' && 'Workspace references (Linux)' || 'Desktop admission' }}
    needs: [desktop]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected matrix result
        env:
          XDNOTE_DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: test "$XDNOTE_DESKTOP_RESULT" = success
