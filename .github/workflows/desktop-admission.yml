name: Windows native update of private xdnote rc.3

on:
  workflow_dispatch:
    inputs:
      transfer_commit:
        description: Frozen private transfer commit
        type: string
        required: true
      checksums_sha256:
        description: SHA-256 of all original candidate and signature bytes
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows-update:
    if: github.repository == 'xiaodaozhi/xdnote' && github.ref == 'refs/heads/coding/155-rc3-windows-update'
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      XDNOTE_TEST_FONT_FILE: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 10fcb69062df2fea383e31fb83c08907929b51cb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: build/native-driver-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the read-only deploy key and fetch the frozen transfer commit
        env:
          XDNOTE_WINDOWS_DIAGNOSTIC_CANDIDATE_KEY: ${{ secrets.XDNOTE_WINDOWS_DIAGNOSTIC_CANDIDATE_KEY }}
          XDNOTE_TRANSFER_COMMIT: ${{ inputs.transfer_commit }}
        run: python build/native-driver-source/.github/rc3-windows-update/fetch.py --destination build/candidate-transport --report build/windows-ssh-diagnostics.json
      - name: Restore and hash the signed assets from Git blobs
        env:
          XDNOTE_TRANSFER_COMMIT: ${{ inputs.transfer_commit }}
          XDNOTE_CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: python build/native-driver-source/.github/rc3-windows-update/restore.py --transport build/candidate-transport --candidate build/release-verified --attachments build/signed-metadata
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
      - name: Prepare the locked Windows build toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
          python scripts/prepare_qt.py --download --host windows --arch win64_msvc2022_64
          python scripts/desktop.py prepare --download
      - name: Prepare the application-local diagnostic font
        run: python scripts/prepare_ci_font.py --output build/test-fonts
      - name: Verify the production signatures and perform the native Windows upgrade
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC toolchain not found' }
          ./scripts/prepare-windows-installer.ps1 -OutputDirectory "$PWD/build/toolchain/installer"
          python scripts/prepare-windows-runtime.py --output build/toolchain/windows-runtime
          $env:PYTHONPATH = "$PWD/scripts"
          Copy-Item build/native-driver-source/.github/rc3-windows-update/driver.py build/check-sealed-candidate-update.py
          python build/check-sealed-candidate-update.py --vcvars "$vs\VC\Auxiliary\Build\vcvars64.bat" --toolchain build/toolchain/installer --runtime build/toolchain/windows-runtime --work-dir build/private-native-acceptance --qt-prefix build/Qt/6.8.2/msvc2022_64 --sealed-candidate build/release-verified --signed-attachments build/signed-metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: xdnote-155-native-windows-rc3
          path: |
            build/windows-ssh-diagnostics.json
            build/private-native-acceptance/report.json
            build/private-native-acceptance/*.log
          if-no-files-found: warn
          retention-days: 3
