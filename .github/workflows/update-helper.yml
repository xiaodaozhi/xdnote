name: Native update helper transactions
run-name: ${{ inputs.scope == 'polkit-gui' && 'GNOME graphical polkit authorization' || inputs.proxy_matrix && 'Native product proxy updates' || 'Native update helper transactions' }}

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [helper, product, polkit, polkit-gui]
        default: helper
      proxy_matrix:
        type: boolean
        default: false
      polkit_probe:
        description: 'Check the local seat and native authentication before installing update fixtures'
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope:
        type: string
        default: helper
      proxy_matrix:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  polkit:
    if: inputs.scope == 'polkit' || inputs.scope == 'polkit-gui'
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare the pinned native helper inputs
        if: '!inputs.polkit_probe'
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup run 1.99.0 cargo fetch --locked
          rustup run 1.99.0 cargo fmt --all --check
          rustup run 1.99.0 cargo test --locked --offline --package xdnote-update-helper --target-dir build/polkit-helper-tests
      - name: Prepare the native authentication probe driver
        if: inputs.scope == 'polkit'
        run: python -m pip install pexpect==4.9.0
      - name: Prepare an isolated GNOME graphical authentication session
        if: inputs.scope == 'polkit-gui'
        timeout-minutes: 8
        run: |
          xdnote_apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
          timeout 120s sudo apt-get "${xdnote_apt_options[@]}" update
          timeout 360s sudo apt-get "${xdnote_apt_options[@]}" install -y --no-install-recommends gnome-shell gnome-settings-daemon xwayland xvfb xauth openbox xdotool x11-apps python3-pyatspi dbus-x11
      - name: Authorize the installed updater through native polkit and PAM
        run: python scripts/check_polkit_authorization.py ${{ !inputs.polkit_probe && '--installed-update' || '' }} ${{ inputs.scope == 'polkit-gui' && '--graphical' || '' }} --output build/polkit-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: polkit-ubuntu-22.04
          path: |
            build/polkit-evidence/*.json
            build/polkit-evidence/gnome-shell.log
            build/polkit-evidence/prompt-*.xwd
          retention-days: 7
  helper:
    if: inputs.scope != 'polkit' && inputs.scope != 'polkit-gui'
    name: ${{ inputs.proxy_matrix && 'Product proxy update' || inputs.scope == 'product' && 'Product update' || 'Native helper' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      PYTHONUTF8: '1'
      XDNOTE_TEST_FONT_FILE: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
    steps:
      - name: Require product scope for proxy matrix
        if: inputs.proxy_matrix && inputs.scope != 'product'
        run: python -c "raise SystemExit('Proxy matrix requires product scope')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare locked Rust inputs
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup run 1.99.0 cargo fetch --locked
      - name: Prepare pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-installer.ps1 -OutputDirectory "$PWD/build/toolchain/installer"
      - name: Prepare product tools and diagnostic font
        if: inputs.scope == 'product'
        run: |
          python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
          python scripts/prepare_ci_font.py --output build/test-fonts
          python scripts/desktop.py prepare --download
      - name: Prepare Linux product libraries with bounded archive access
        if: inputs.scope == 'product' && runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p build/ci-apt
          xdnote_apt_archive=https://archive.ubuntu.com/ubuntu
          xdnote_apt_security=https://security.ubuntu.com/ubuntu
          if ! timeout 10s getent ahosts archive.ubuntu.com > /dev/null || ! timeout 10s getent ahosts security.ubuntu.com > /dev/null; then
            xdnote_apt_archive=https://mirrors.kernel.org/ubuntu
            xdnote_apt_security=$xdnote_apt_archive
          fi
          cat > build/ci-apt/ubuntu.list <<EOF
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_archive jammy main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_archive jammy-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_security jammy-security main universe restricted multiverse
          EOF
          xdnote_apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/ci-apt/ubuntu.list" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
          timeout 180s sudo apt-get "${xdnote_apt_options[@]}" update
          timeout 360s sudo apt-get "${xdnote_apt_options[@]}" install -y libgl1-mesa-dev libegl1-mesa-dev libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-xinput0 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 libxcb-xfixes0 libxkbcommon-x11-0 patchelf desktop-file-utils shared-mime-info zlib1g-dev libssl-dev libkrb5-dev libproxy-dev libpsl-dev libicu-dev libzstd-dev
      - name: Prepare pinned Linux Qt SDK
        if: inputs.scope == 'product' && runner.os == 'Linux'
        run: python scripts/prepare_qt.py --download --host linux --arch linux_gcc_64
      - name: Prepare pinned Windows product SDK and runtime materials
        if: inputs.scope == 'product' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/prepare_qt.py --download --host windows --arch win64_msvc2022_64
          python scripts/prepare-windows-runtime.py --output build/toolchain/windows-runtime
      - name: Exercise Windows native transactions in the disposable account
        if: runner.os == 'Windows' && !inputs.proxy_matrix
        run: python scripts/check_update_helper.py --work-dir build/native-helper-fixture --toolchain build/toolchain/installer
      - name: Exercise Linux native transactions on the disposable runner
        if: runner.os == 'Linux' && !inputs.proxy_matrix
        run: python scripts/check_update_helper.py --work-dir build/native-helper-fixture
      - name: Exercise Windows product updates with owned documents
        if: inputs.scope == 'product' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $xdnoteVs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$xdnoteVs) { throw 'MSVC toolchain not found' }
          python scripts/check_native_product_update.py --work-dir build/native-product-fixture --qt-prefix build/Qt/6.8.2/msvc2022_64 --toolchain build/toolchain/installer --runtime build/toolchain/windows-runtime --vcvars "$xdnoteVs\VC\Auxiliary\Build\vcvars64.bat" ${{ inputs.proxy_matrix && '--proxy-matrix' || '' }}
      - name: Exercise Linux product updates with owned documents
        if: inputs.scope == 'product' && runner.os == 'Linux'
        run: python scripts/check_native_product_update.py --work-dir build/native-product-fixture --qt-prefix build/Qt/6.8.2/gcc_64 ${{ inputs.proxy_matrix && '--proxy-matrix' || '' }}
      - name: Preserve bounded transaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-helper-${{ runner.os }}
          retention-days: 7
          path: |
            build/native-helper-fixture/*.json
            build/native-helper-fixture/*.log
            build/native-helper-fixture/job-*/*.json
            build/native-helper-fixture/job-*/*.log
            build/native-product-fixture/*.json
            build/native-product-fixture/*.log
            build/native-product-fixture/source/build/*-identity.json
            build/native-product-fixture/source/build/native-run/*.json
            build/native-product-fixture/source/build/desktop/generated/build-version.json
