name: Qt proxy flow

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  flow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            host: linux
            arch: linux_gcc_64
            qt: gcc_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            qt: msvc2022_64
          - os: macos-26
            host: mac
            arch: clang_64
            qt: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare fixed build tools
        run: python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
      - name: Check preparation and evidence contracts
        run: python -m unittest discover -s scripts/tests
      - name: Prepare Linux source-build inputs
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p build/ci-apt
          xdnote_apt_archive=https://archive.ubuntu.com/ubuntu
          xdnote_apt_security=https://security.ubuntu.com/ubuntu
          if ! timeout 10s getent ahosts archive.ubuntu.com > /dev/null || ! timeout 10s getent ahosts security.ubuntu.com > /dev/null; then
            xdnote_apt_archive=https://mirrors.kernel.org/ubuntu
            xdnote_apt_security=$xdnote_apt_archive
          fi
          cat > build/ci-apt/ubuntu.list <<EOF
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_archive jammy main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_archive jammy-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $xdnote_apt_security jammy-security main universe restricted multiverse
          EOF
          xdnote_apt_options=(-o "Dir::Etc::sourcelist=$PWD/build/ci-apt/ubuntu.list" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any)
          timeout 180s sudo apt-get "${xdnote_apt_options[@]}" update
          timeout 360s sudo apt-get "${xdnote_apt_options[@]}" install -y zlib1g-dev libssl-dev libkrb5-dev libproxy-dev libpsl-dev libicu-dev libzstd-dev
      - name: Prepare original SDK and pinned Network source variant
        run: python scripts/prepare_qt.py --download --host ${{ matrix.host }} --arch ${{ matrix.arch }}
      - name: Exercise owned unpaced flow on Unix
        if: runner.os != 'Windows'
        run: python scripts/check_qt_network_flow.py --qt-prefix build/Qt/6.8.2/${{ matrix.qt }} --work-dir build/network-flow
      - name: Exercise owned unpaced flow on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $xdnoteVs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$xdnoteVs) { throw 'Visual Studio 2022 not found' }
          python scripts/check_qt_network_flow.py --qt-prefix build/Qt/6.8.2/${{ matrix.qt }} --work-dir build/network-flow --vcvars "$xdnoteVs\VC\Auxiliary\Build\vcvars64.bat"
      - name: Preserve bounded flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qt-network-flow-${{ matrix.os }}
          retention-days: 7
          path: |
            build/network-flow/*.json
            build/network-flow/*.log
            build/QtNetworkBackports/xdnote-network.1/${{ matrix.qt }}/*.json
            build/QtNetworkBackports/xdnote-network.1/${{ matrix.qt }}/*.log
            build/toolchain/openssl-configure/3.5.9/*/*.json
            build/toolchain/openssl-configure/3.5.9/*/*.log
