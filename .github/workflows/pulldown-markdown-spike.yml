name: Markdown parser experiment

on:
  push:
    branches: [main]
    paths:
      - 'experiments/pulldown-markdown-spike/**'
      - 'experiments/qt-document-spike/tests/fixtures/markdown-core.md'
      - '.github/workflows/pulldown-markdown-spike.yml'
  pull_request:
    paths:
      - 'experiments/pulldown-markdown-spike/**'
      - 'experiments/qt-document-spike/tests/fixtures/markdown-core.md'
      - '.github/workflows/pulldown-markdown-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser:
    name: Parser experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/pulldown-markdown-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.85.1'
      - name: Explicitly fetch locked experiment dependencies
        run: cargo +1.85.1 fetch --locked --manifest-path experiments/pulldown-markdown-spike/Cargo.toml
      - name: Run parser and boundary tests offline
        run: cargo +1.85.1 test --locked --offline --manifest-path experiments/pulldown-markdown-spike/Cargo.toml
      - name: Measure a synthetic parser-only sample
        run: cargo +1.85.1 run --release --locked --offline --manifest-path experiments/pulldown-markdown-spike/Cargo.toml
