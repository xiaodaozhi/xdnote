name: Exact MSIX client acceptance
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Public recipient for the encrypted upload receipt
        type: string
        required: true
      transfer_size:
        description: Exact byte length of the encrypted ZIP transfer
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  client:
    if: github.repository == 'xiaodaozhi/xdnote' && github.ref == 'refs/heads/codex/issue-156-client-build1'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        client: ['1809', '26100']
    env:
      GH_TOKEN: ${{ github.token }}
      CLIENT: ${{ matrix.client }}
      CASE_DIR: ${{ github.workspace }}/build/client
      RECEIPT_RECIPIENT: ${{ inputs.recipient }}
      TRANSFER_SIZE: ${{ inputs.transfer_size }}
      MSIX_SHA: 2bb2b3da8ef8597a6a1f030572fbcc6908e4af280a8d32507899b49f69da5f00
      PRODUCT_COMMIT: 75a4872eb5aae6c059b6787041119cb2fb849489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare network-isolated x64 guest tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age qemu-system-x86 qemu-utils xorriso mtools dosfstools ovmf swtpm
          test -c /dev/kvm
          umask 077
          mkdir -p "$CASE_DIR/receipt"
          age-keygen -o "$CASE_DIR/client.key"
          age-keygen -y "$CASE_DIR/client.key" > "$CASE_DIR/recipient.txt"
      - name: Allocate an encrypted Actions transfer
        uses: ./experiments/windows-client-candidate/transport
        env:
          TRANSFER_MODE: offer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-offer-${{ matrix.client }}
          path: build/client/receipt/offer.age
          retention-days: 1
          if-no-files-found: error
      - name: Boot the matching Microsoft x64 evaluation client
        timeout-minutes: 32
        run: |
          root=experiments/windows-client-candidate
          bash "$root/boot-$CLIENT.sh" "$CASE_DIR"
          sudo python3 "$root/collect.py" "$CASE_DIR" ready
      - name: Wait for the locally supplied sealed MSIX
        uses: ./experiments/windows-client-candidate/transport
        env:
          TRANSFER_MODE: finalize
      - name: Verify and attach the original candidate read-only
        run: |
          root=experiments/windows-client-candidate
          mkdir "$CASE_DIR/download" "$CASE_DIR/input"
          for attempt in {1..15}; do
            if gh run download "$GITHUB_RUN_ID" --name "client-input-$CLIENT" --dir "$CASE_DIR/download" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              break
            fi
            sleep 4
          done
          test -s "$CASE_DIR/download/payload.age"
          age --decrypt --identity "$CASE_DIR/client.key" --output "$CASE_DIR/input/candidate.msix" "$CASE_DIR/download/payload.age"
          rm -- "$CASE_DIR/client.key"
          printf '%s  %s\n' "$MSIX_SHA" "$CASE_DIR/input/candidate.msix" | sha256sum -c
          printf '%s\n%s\n%s\n' "$MSIX_SHA" "$PRODUCT_COMMIT" "$CLIENT" > "$CASE_DIR/input/identity.txt"
          xorriso -as mkisofs -R -J -V XDNOTE_TESTS -o "$CASE_DIR/transfer.iso" "$CASE_DIR/input"
          sudo python3 "$root/collect.py" "$CASE_DIR" attach
      - name: Verify launch, save and file associations on the client
        timeout-minutes: 10
        run: sudo python3 experiments/windows-client-candidate/collect.py "$CASE_DIR" result
      - name: Stop the guest and keep only evidence
        if: always()
        run: |
          root=experiments/windows-client-candidate
          if test -S "$CASE_DIR/monitor"; then
            sudo python3 "$root/collect.py" "$CASE_DIR" screenshot || true
            sudo python3 "$root/collect.py" "$CASE_DIR" quit || true
          fi
          if test -f "$CASE_DIR/tpm.pid"; then
            kill "$(cat "$CASE_DIR/tpm.pid")" || true
          fi
          if test -d "$CASE_DIR/evidence"; then
            sudo chown -R "$(id -u):$(id -g)" "$CASE_DIR/evidence"
          fi
          rm -f -- "$CASE_DIR/client.key" "$CASE_DIR/input/candidate.msix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-evidence-${{ matrix.client }}
          path: |
            build/client/evidence/
            build/client/serial.log
          retention-days: 7
          if-no-files-found: warn
