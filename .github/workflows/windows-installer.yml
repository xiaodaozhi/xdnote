name: Disposable Windows client runner probe
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [fixtures, product]
        default: fixtures
permissions:
  contents: read
jobs:
  x64-virtualization:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check x64 KVM and storage
        run: |
          uname -m
          df -h "$RUNNER_TEMP"
          ls -l /dev/kvm || true
          grep -Eom1 'vmx|svm' /proc/cpuinfo || true
          sudo python3 - <<'PY'
          import fcntl
          from pathlib import Path
          if not Path('/dev/kvm').is_char_device():
              raise SystemExit('The runner has no KVM device')
          with open('/dev/kvm', 'rb+') as device:
              print('KVM API:', fcntl.ioctl(device, 0xAE00, 0))
              vm = fcntl.ioctl(device, 0xAE01, 0)
              print('KVM VM creation succeeded')
              import os
              os.close(vm)
          PY
  windows-client:
    runs-on: windows-11-arm
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check client OS, interactive desktop and x64 toolchain
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,ProductType,OSArchitecture | ConvertTo-Json
          Get-Process explorer | Select-Object ProcessName,SessionId
          python -c "import platform; print(platform.machine(), platform.architecture(), platform.win32_ver())"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Host*\x64\cl.exe" -ErrorAction SilentlyContinue | ForEach-Object FullName
            Get-ChildItem "$vs\VC\Auxiliary\Build\vcvars*.bat" -ErrorAction SilentlyContinue | ForEach-Object Name
          }
          rustup show
