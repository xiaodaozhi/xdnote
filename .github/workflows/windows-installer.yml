name: Private Windows release candidate assets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'fixtures checks engine guards; product builds and tests the actual installer payload'
        type: choice
        options: [fixtures, product]
        default: fixtures
  workflow_call:
    inputs:
      scope:
        type: string
        default: fixtures

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product-installer:
    if: inputs.scope == 'product'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      XDNOTE_TEST_FONT_FILE: ${{ github.workspace }}/build/test-fonts/NotoSansCJKsc-Regular.otf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ed6ac069a0c289f8c852bbc4641f8adb32169e3a
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.0'
      - name: Prepare locked build tools
        run: python -m pip install aqtinstall==3.3.0 py7zr==1.0.0 cmake==4.4.4 ninja==1.13.0
      - name: Check input and workflow contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Prepare application-local diagnostic font
        run: python scripts/prepare_ci_font.py --output build/test-fonts
      - name: Prepare pinned Qt and editor inputs
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/prepare_qt.py --download --host windows --arch win64_msvc2022_64
          python scripts/desktop.py prepare --download
      - name: Build the actual product and diagnostic entry points
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $xdnoteVs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$xdnoteVs) { throw 'MSVC toolchain not found' }
          New-Item -ItemType Directory -Path build/product-install -Force | Out-Null
          @{
            schemaVersion=1;product='xdnote';version='0.1.0-rc.1';build=2;revision=(git rev-parse HEAD)
            previousVersion='0.0.0';previousBuild=0
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM build/product-install/identity-input.json
          python scripts/desktop.py build --vcvars "$xdnoteVs\VC\Auxiliary\Build\vcvars64.bat" --parallel 4 --release-identity build/product-install/identity-input.json
          ctest --test-dir build/desktop-admission -R '^installation_guard$' --output-on-failure
          python scripts/check_product_linkage.py --executable build/desktop-admission/xdnote.exe
      - name: Prepare pinned installer tools and runtime materials
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/prepare-windows-installer.ps1 -OutputDirectory "$PWD/build/toolchain/installer"
          python scripts/prepare-windows-runtime.py --output build/toolchain/windows-runtime
      - name: Seal actual product payload and bind license evidence
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/deployment_inventory.py --build-dir build/desktop-admission --qt-prefix build/Qt/6.8.2/msvc2022_64 --destination build/product-install/staging --redist-dir build/toolchain/windows-runtime/runtime
          python scripts/installer_payload.py --source build/product-install/staging --audit build/product-install/staging-evidence/inventory.json --destination build/product-install/payload --toolchain build/toolchain/installer --runtime build/toolchain/windows-runtime/runtime --build-dir build/desktop-admission --qt-prefix build/Qt/6.8.2/msvc2022_64 --report build/product-install/payload-inventory.json
          python scripts/distribution_audit.py --root build/product-install/payload --audit build/product-install/payload-inventory.json --qt-prefix build/Qt/6.8.2/msvc2022_64 --report build/product-install/license-evidence.json
          python scripts/compatibility_audit.py --root build/product-install/payload --report build/product-install/compatibility.json
          python scripts/developer_archive.py --root build/product-install/payload --audit build/product-install/payload-inventory.json --compatibility build/product-install/compatibility.json --output build/product-install/xdnote-0.1.0-rc.1-windows-x86_64.zip
          python scripts/build-windows-installer.py --root build/product-install/payload --audit build/product-install/payload-inventory.json --toolchain build/toolchain/installer --output build/product-install/xdnote-0.1.0-rc.1-windows-x86_64-setup.exe --report build/product-install/installer-report.json
      - name: Install and exercise the exact Windows RC package
        shell: pwsh
        run: ./scripts/test-windows-product-install.ps1 -Package "$PWD/build/product-install/xdnote-0.1.0-rc.1-windows-x86_64-setup.exe" -Audit build/product-install/payload-inventory.json -PackageReport build/product-install/installer-report.json -BuildDirectory build/desktop-admission -QtPrefix build/Qt/6.8.2/msvc2022_64 -EvidenceDirectory "$PWD/build/product-install/roundtrip-evidence"
      - name: Transfer only the verified encrypted RC assets
        if: success() && runner.environment == 'github-hosted'
        shell: pwsh
        env:
          XDNOTE_CANDIDATE_RECIPIENT: age176gs378e3k0q36e95kva7fl065j5j0n2tv4pfltrcnzmt45r3sqs3tkyjj
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          $private = Join-Path $env:RUNNER_TEMP 'xdnote-windows-rc'
          New-Item -ItemType Directory -Path $private | Out-Null
          $age = Join-Path $private 'age.zip'
          curl.exe --fail --location --max-time 60 --retry 2 --silent --show-error https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip --output $age
          if ((Get-FileHash -LiteralPath $age).Hash.ToLowerInvariant() -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw 'age package checksum differs' }
          Expand-Archive -LiteralPath $age -DestinationPath "$private/age"
          $ageTool = (Get-ChildItem "$private/age" -Recurse -Filter 'age.exe' | Select-Object -First 1).FullName
          $assets = @('build/product-install/xdnote-0.1.0-rc.1-windows-x86_64.zip','build/product-install/xdnote-0.1.0-rc.1-windows-x86_64-setup.exe')
          $hashes = [ordered]@{}
          foreach ($file in $assets) {
            $item=Get-Item -LiteralPath $file
            $hashes[$item.Name] = @{sha256=(Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant();bytes=$item.Length}
          }
          $hashes | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM build/product-install/rc-asset-hashes.json
          Compress-Archive -LiteralPath $assets -DestinationPath "$private/payload.zip" -CompressionLevel NoCompression
          & $ageTool --recipient $env:XDNOTE_CANDIDATE_RECIPIENT --output "$private/rc-windows-assets.zip.age" "$private/payload.zip"
      - name: Preserve the encrypted private assets
        if: success() && runner.environment == 'github-hosted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-windows-candidate
          path: ${{ runner.temp }}/xdnote-windows-rc/rc-windows-assets.zip.age
          if-no-files-found: error
          retention-days: 1
      - name: Preserve RC package and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-rc-evidence
          path: |
            build/product-install/*.json
            build/product-install/roundtrip-evidence/report.json
          if-no-files-found: warn
          retention-days: 7
