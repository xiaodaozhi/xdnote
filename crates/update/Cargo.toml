[package]
name = "xdnote-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
release-tool = ["dep:base64ct", "dep:zeroize", "ed25519-dalek/zeroize"]

[[bin]]
name = "xdnote-update-tool"
required-features = ["release-tool"]

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"], optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.1", optional = true }
