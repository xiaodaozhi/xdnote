[workspace]
members = ["crates/markdown", "crates/update"]
# Desktop builds still produce only the linked Markdown service. The update
# core is checked explicitly or with --workspace until product integration.
default-members = ["crates/markdown"]
exclude = ["experiments/pulldown-markdown-spike"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
panic = "unwind"
